name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Node Modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/mobile/node_modules
            apps/web/node_modules
            apps/api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'apps/mobile/package-lock.json', 'apps/web/package-lock.json', 'apps/api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # npm ci (not npm install) enforces exact lockfile versions — fails on drift
      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci --legacy-peer-deps

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci --legacy-peer-deps

      - name: Install Mobile dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      - name: Run Linter (Mobile, Web & Backend API)
        run: npm run lint

  typecheck:
    name: TypeCheck (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Node Modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/mobile/node_modules
            apps/web/node_modules
            apps/api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'apps/mobile/package-lock.json', 'apps/web/package-lock.json', 'apps/api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci --legacy-peer-deps

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci --legacy-peer-deps

      - name: Install Mobile dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      - name: Run TypeCheck (Mobile)
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Run TypeCheck (Web)
        working-directory: apps/web
        run: npx tsc --noEmit

  test:
    name: Test & Coverage Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Node Modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/mobile/node_modules
            apps/web/node_modules
            apps/api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'apps/mobile/package-lock.json', 'apps/web/package-lock.json', 'apps/api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci --legacy-peer-deps

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci --legacy-peer-deps

      - name: Install Mobile dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      - name: Run All Test Suites
        run: npm test

      - name: Run Coverage Gate (Threshold Enforcement)
        run: npm run test:coverage

      - name: Build Web Application
        working-directory: apps/web
        run: npm run build

  security:
    name: Dependency Audit & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Security Audit
        run: |
          npm audit --audit-level=critical
          npm --prefix apps/web audit --audit-level=critical
          npm --prefix apps/api audit --audit-level=critical
