name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            mobile/node_modules
            web/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'mobile/package-lock.json', 'web/package-lock.json', 'backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          cd apps/mobile && npm install --legacy-peer-deps && cd ..
          cd apps/web && npm install && cd ..
          cd apps/api && npm install && cd ..

      - name: Run Linter (Mobile & Web)
        run: npm run lint

  typecheck:
    name: TypeCheck (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            mobile/node_modules
            web/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'mobile/package-lock.json', 'web/package-lock.json', 'backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          cd apps/mobile && npm install --legacy-peer-deps && cd ..
          cd apps/web && npm install && cd ..

      - name: Run TypeCheck (Mobile)
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Run TypeCheck (Web)
        working-directory: apps/web
        run: npx tsc --noEmit

  test:
    name: Test (Monorepo Test Suites)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            mobile/node_modules
            web/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'mobile/package-lock.json', 'web/package-lock.json', 'backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          cd apps/mobile && npm install --legacy-peer-deps && cd ..
          cd apps/web && npm install && cd ..
          cd apps/api && npm install && cd ..

      - name: Run All Test Suites
        run: npm test

      - name: Build Web Application
        working-directory: apps/web
        run: npm run build
