name: 'Code Quality & Linting'

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: 'Lint & Format Verification'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm --prefix apps/mobile install --no-audit --legacy-peer-deps
          npm --prefix apps/web install --no-audit
          npm --prefix apps/api install --no-audit

      - name: Typecheck Mobile
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Verify Prettier & ESLint (if configured)
        run: |
          npm --prefix apps/mobile run lint || true
