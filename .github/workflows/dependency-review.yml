name: 'Dependency Review & Security'

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  dependency-health:
    name: 'Dependency Health & Audit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Root Manifest
        run: |
          node -e "const pkg = require('./package.json'); console.log('Declared dependencies:', Object.keys(pkg.dependencies || {}).length);"

      - name: Check Backend Dependencies
        run: |
          npm --prefix apps/api install --no-audit
          npm --prefix apps/api audit --audit-level=critical || true

      - name: Check Web Dependencies
        run: |
          npm --prefix apps/web install --no-audit
          npm --prefix apps/web audit --audit-level=critical || true

      - name: Check Mobile Dependencies
        run: |
          npm --prefix apps/mobile install --no-audit --legacy-peer-deps
          npm --prefix apps/mobile audit --audit-level=critical || true
