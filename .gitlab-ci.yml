# Scorr - GitLab CI/CD Pipeline Configuration
image: node:20-alpine

stages:
  - test
  - build
  - security

cache:
  paths:
    - node_modules/
    - apps/mobile/node_modules/
    - apps/web/node_modules/
    - apps/api/node_modules/

test:backend:
  stage: test
  script:
    - cd apps/api && npm install --no-audit && npm test

test:web:
  stage: test
  script:
    - cd apps/web && npm install --no-audit && npm test

test:mobile:
  stage: test
  script:
    - cd apps/mobile && npm install --no-audit --legacy-peer-deps && npm run typecheck && npm test

build:web:
  stage: build
  script:
    - cd apps/web && npm install --no-audit && npm run build
  only:
    - main
    - develop

security:audit:
  stage: security
  script:
    - npm --prefix apps/api audit --audit-level=critical || true
    - npm --prefix apps/web audit --audit-level=critical || true
