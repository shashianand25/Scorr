# Scorr - Azure DevOps Pipelines Configuration
trigger:
  - main
  - develop

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js 20'

  - script: |
      npm --prefix apps/api install --no-audit
      npm --prefix apps/api test
    displayName: 'Backend Tests'

  - script: |
      npm --prefix apps/web install --no-audit
      npm --prefix apps/web test
    displayName: 'Web Tests'

  - script: |
      npm --prefix apps/mobile install --no-audit --legacy-peer-deps
      npm --prefix apps/mobile run typecheck
      npm --prefix apps/mobile test
    displayName: 'Mobile Tests & TypeCheck'
