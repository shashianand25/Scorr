version: '3.8'

services:
  # Local PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: scorr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: scorr_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Scorr Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scorr-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/scorr_db?sslmode=disable
      GEMINI_API_KEY: your_gemini_api_key_here
      GEMINI_MODEL_URL: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
      RESEND_API_KEY: re_placeholder_key
      RESEND_FROM_EMAIL: support@scorrapp.com
      AI_DAILY_LIMIT: 10
      JSON_BODY_LIMIT_MB: 10
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Scorr Web Landing & App Preview
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: scorr-web
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  postgres_data:
