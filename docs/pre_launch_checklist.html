<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scorr — Pre-Launch Checklist</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  :root {
    --bg:#08090f;--surface:#10131f;--card:#141826;--border:rgba(255,255,255,0.07);
    --accent:#6366f1;--accent2:#818cf8;--green:#34d399;--yellow:#fbbf24;
    --red:#f87171;--orange:#fb923c;--muted:#5a6080;--txt:#e2e8f0;--txt2:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:80px}
  .hero{background:linear-gradient(135deg,#0f1220 0%,#151b35 50%,#0f1220 100%);border-bottom:1px solid var(--border);padding:48px 24px 36px;text-align:center;position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(99,102,241,0.12) 0%,transparent 70%);top:-200px;left:50%;transform:translateX(-50%);pointer-events:none}
  .hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.3);border-radius:100px;padding:6px 16px;font-size:12px;font-weight:600;color:var(--accent2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px}
  .hero h1{font-size:clamp(28px,5vw,42px);font-weight:800;line-height:1.15;margin-bottom:10px}
  .hero h1 span{background:linear-gradient(135deg,#818cf8,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .hero p{color:var(--txt2);font-size:15px;max-width:480px;margin:0 auto 28px;line-height:1.6}
  .progress-wrap{max-width:640px;margin:0 auto}
  .progress-stats{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .progress-count{font-size:28px;font-weight:800;color:var(--accent2)}
  .progress-pct{font-size:14px;color:var(--txt2)}
  .progress-bar-bg{height:8px;background:rgba(255,255,255,0.07);border-radius:100px;overflow:hidden}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,#6366f1,#818cf8);border-radius:100px;transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px rgba(99,102,241,0.5)}
  .controls{max-width:860px;margin:24px auto 0;padding:0 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .filter-btn{padding:8px 18px;border-radius:100px;border:1px solid var(--border);background:var(--card);color:var(--txt2);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;font-family:inherit}
  .filter-btn:hover{border-color:var(--accent);color:var(--txt)}
  .filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .reset-btn{margin-left:auto;padding:8px 18px;border-radius:100px;border:1px solid rgba(248,113,113,0.3);background:rgba(248,113,113,0.07);color:var(--red);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;font-family:inherit}
  .reset-btn:hover{background:rgba(248,113,113,0.15)}
  .main{max-width:860px;margin:32px auto 0;padding:0 20px}
  .section{background:var(--card);border:1px solid var(--border);border-radius:20px;margin-bottom:20px;overflow:hidden;transition:border-color .3s}
  .section.complete{border-color:rgba(52,211,153,0.25)}
  .section-header{display:flex;align-items:center;gap:14px;padding:20px 24px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border)}
  .section.collapsed .section-header{border-bottom-color:transparent}
  .section-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .section-title{flex:1}
  .section-title h2{font-size:16px;font-weight:700;margin-bottom:2px}
  .section-title p{font-size:12px;color:var(--txt2)}
  .section-meta{display:flex;align-items:center;gap:10px}
  .section-pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:100px}
  .section-chevron{color:var(--muted);font-size:14px;transition:transform .25s}
  .section.collapsed .section-chevron{transform:rotate(-90deg)}
  .section-body{padding:8px 0 12px}
  .section.collapsed .section-body{display:none}
  .item{display:flex;align-items:flex-start;gap:14px;padding:10px 24px;border-radius:10px;transition:background .15s;cursor:pointer}
  .item:hover{background:rgba(255,255,255,0.03)}
  .item.done .item-label{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,255,255,0.2)}
  .item.hidden{display:none}
  .checkbox{width:22px;height:22px;border-radius:7px;flex-shrink:0;border:2px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.4,0,.2,1);margin-top:1px}
  .item.done .checkbox{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(52,211,153,0.35)}
  .checkbox-tick{opacity:0;transform:scale(0.5);transition:all .2s cubic-bezier(.4,0,.2,1);color:#0a0f1e;font-size:13px;font-weight:800;line-height:1}
  .item.done .checkbox-tick{opacity:1;transform:scale(1)}
  .item-content{flex:1}
  .item-label{font-size:14px;line-height:1.55;font-weight:450;color:var(--txt);transition:color .2s}
  .item-note{font-size:12px;color:var(--muted);margin-top:3px;font-style:italic}
  .priority{font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;flex-shrink:0;letter-spacing:.04em;margin-top:3px;text-transform:uppercase;white-space:nowrap}
  .p-must{background:rgba(248,113,113,0.12);color:var(--red);border:1px solid rgba(248,113,113,0.25)}
  .p-should{background:rgba(251,146,60,0.12);color:var(--orange);border:1px solid rgba(251,146,60,0.25)}
  .p-nice{background:rgba(251,191,36,0.10);color:var(--yellow);border:1px solid rgba(251,191,36,0.2)}
  .emergency-box{background:linear-gradient(135deg,rgba(99,102,241,0.08),rgba(129,140,248,0.05));border:1px solid rgba(99,102,241,0.2);border-radius:16px;padding:20px 24px;margin:16px 24px 8px}
  .emergency-box h3{font-size:14px;font-weight:700;color:var(--accent2);margin-bottom:14px}
  .emergency-table{width:100%;border-collapse:collapse}
  .emergency-table td{padding:8px 12px;font-size:13px;border-bottom:1px solid var(--border)}
  .emergency-table tr:last-child td{border-bottom:none}
  .emergency-table td:first-child{color:var(--txt2);font-weight:500;width:40%}
  .emergency-table td:last-child{color:var(--txt);font-family:'SF Mono','Fira Code',monospace;font-size:12px}
  .done-banner{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;font-size:15px;font-weight:700;padding:14px 32px;border-radius:100px;box-shadow:0 8px 32px rgba(99,102,241,0.4);opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;z-index:9998}
  .done-banner.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-badge">🚀 Launch Readiness</div>
  <h1>Scorr <span>Pre-Launch</span> Checklist</h1>
  <p>Work through every item before you press publish. Don't skip the 🔴 Must items.</p>
  <div class="progress-wrap">
    <div class="progress-stats">
      <span class="progress-count" id="count">0 / 0</span>
      <span class="progress-pct" id="pct">0% complete</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="bar" style="width:0%"></div></div>
  </div>
</div>
<div class="controls">
  <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" onclick="setFilter('todo',this)">Remaining</button>
  <button class="filter-btn" onclick="setFilter('done',this)">Done</button>
  <button class="reset-btn" onclick="resetAll()">Reset All</button>
</div>
<div class="main" id="main"></div>
<div class="done-banner" id="done-banner">🎉 All checks passed — ready to launch!</div>
<script>
const DATA=[{id:'backend',icon:'🖥️',iconBg:'rgba(99,102,241,0.15)',title:'Backend & Config',subtitle:'Verify server is healthy before anything else',pill:'🔴 Must',pillClass:'p-must',items:[{id:'b1',label:'Hit /api/app-config in production — verify it returns featureFlags, aiConfig, fileLimits, appLinks',p:'must'},{id:'b2',label:'Hit /api/version-config — verify it returns minimumVersion, latestVersion, updatePromptScheduleDays',p:'must'},{id:'b3',label:'No console.error in Vercel → Functions → Logs on a clean app boot',p:'must'},{id:'b4',label:'MAINTENANCE_MODE, DISABLE_AI, DISABLE_BATTLES are all false in Vercel env vars',p:'must'},{id:'b5',label:'Test maintenance flag: set MAINTENANCE_MODE=true, open app, confirm gate screen appears, set it back',p:'must'},{id:'b6',label:'Test AI kill-switch: set DISABLE_AI=true, try generating a quiz, confirm alert appears, set it back',p:'must'},{id:'b7',label:'Backend enforces request size — send a 12 MB body, expect a 413 response',p:'must'},{id:'b8',label:'DB connection does not time out after 5+ minutes of idle traffic',p:'should'},{id:'b9',label:'APP_MINIMUM_VERSION and APP_LATEST_VERSION match the version in app.json',p:'must'},{id:'b10',label:'GEMINI_API_KEY is valid — make a real AI generation call and confirm it succeeds',p:'must'}]},{id:'flow',icon:'🔄',iconBg:'rgba(52,211,153,0.12)',title:'Full User Flow (New Account)',subtitle:'Test on a real device, not a simulator',pill:'🔴 Must',pillClass:'p-must',items:[{id:'f1',label:'Sign up with a brand-new email — no errors, reaches home screen',p:'must'},{id:'f2',label:'Create a quiz manually (type questions and answers)',p:'must'},{id:'f3',label:'Import a quiz from a PDF file',p:'must'},{id:'f4',label:'Import a quiz from a PPT file',p:'must'},{id:'f5',label:'Generate a quiz using AI from a PDF — questions look correct and parseable',p:'must'},{id:'f6',label:'Solve the quiz — answers register correctly, score is calculated right',p:'must'},{id:'f7',label:'View results / report card — all answers shown correctly',p:'must'},{id:'f8',label:'Check quiz history — attempt appears with correct score and date',p:'must'},{id:'f9',label:'Open Insights — stats and graphs are correct',p:'must'},{id:'f10',label:'Create a flashcard deck and study it (flip, mark known/unknown)',p:'must'},{id:'f11',label:'Share a quiz — link looks correct, opens app on another device',p:'must'},{id:'f12',label:'Import a shared quiz from a deep link (scorrapp.com/share/quiz/...)',p:'must'},{id:'f13',label:'Create a Battle room, join from a second device, complete a match',p:'must'},{id:'f14',label:'Log out — session is cleared',p:'must'},{id:'f15',label:'Log back in — all data is still there',p:'must'},{id:'f16',label:'Uninstall the app, reinstall, log in — data is still there (server-side persistence confirmed)',p:'must'},{id:'f17',label:'Delete a quiz — it disappears and does not reappear on refresh',p:'must'},{id:'f18',label:'Edit a quiz title — change persists after force-closing and reopening',p:'should'}]},{id:'errors',icon:'⚠️',iconBg:'rgba(251,191,36,0.12)',title:'Error & Edge Cases',subtitle:'Every error path must show a human-readable message',pill:'🔴 Must',pillClass:'p-must',items:[{id:'e1',label:'Airplane mode mid-quiz — app does not crash, shows useful error, data is not lost',p:'must'},{id:'e2',label:'Airplane mode before opening — cached data shows, no white screen or crash',p:'must'},{id:'e3',label:'Upload a file that exceeds the size limit — error message is clear, not a raw JSON dump',p:'must'},{id:'e4',label:'Upload a corrupt or empty PDF — error message is clear',p:'must'},{id:'e5',label:'Upload an unsupported file type — clear rejection message, app does not hang',p:'must'},{id:'e6',label:'AI generation times out (60 s) — user sees a useful message, not a frozen spinner',p:'must'},{id:'e7',label:'Kill the backend mid-generation — app shows error and lets the user try again',p:'must'},{id:'e8',label:'Join a Battle with an invalid room code — error message is clear',p:'must'},{id:'e9',label:'Create a Battle, second player never joins — host can exit cleanly without crashing',p:'must'},{id:'e10',label:'Sign up with an already-used email — error is specific (not "something went wrong")',p:'must'},{id:'e11',label:'Sign in with wrong password — error is specific',p:'must'},{id:'e12',label:'AI returns empty or garbled text — app shows error, does not save an empty quiz',p:'must'},{id:'e13',label:'Submit a quiz with zero questions — blocked with a clear validation message',p:'should'},{id:'e14',label:'Open a share link for a quiz that no longer exists — graceful error, not a crash',p:'should'}]},{id:'auth',icon:'🔐',iconBg:'rgba(248,113,113,0.12)',title:'Auth & Data Safety',subtitle:'Session security and per-user data isolation',pill:'🔴 Must',pillClass:'p-must',items:[{id:'a1',label:'Password reset flow works end to end (email arrives, link works, can set new password)',p:'must'},{id:'a2',label:'Session persists after force-closing and reopening the app',p:'must'},{id:'a3',label:'A logged-out user cannot access any authenticated API routes (returns 401)',p:'must'},{id:'a4',label:'User A cannot see or access User B\'s quizzes',p:'must'},{id:'a5',label:'Firebase security rules prevent direct DB reads/writes without auth',p:'must'},{id:'a6',label:'Neon/Postgres is not publicly accessible without credentials',p:'must'}]},{id:'network',icon:'📡',iconBg:'rgba(129,140,248,0.12)',title:'Network Conditions',subtitle:'Use Network Link Conditioner (iOS) or Developer Options (Android)',pill:'🟠 Should',pillClass:'p-should',items:[{id:'n1',label:'Slow 3G — loading states appear, not blank screens',p:'should',note:'iOS: Network Link Conditioner · Android: Developer Options → Simulate network'},{id:'n2',label:'Slow 3G — errors shown if requests fail, not infinite spinners',p:'should'},{id:'n3',label:'Intermittent network (toggle airplane mode every few seconds) — no crashes',p:'should'},{id:'n4',label:'Retry is possible without restarting the app after a network failure',p:'should'},{id:'n5',label:'AI generation shows progress bar on slow network, not just a blank screen',p:'should'}]},{id:'perf',icon:'⚡',iconBg:'rgba(251,191,36,0.12)',title:'Performance',subtitle:'Test on a mid-range Android device, not a flagship',pill:'🟠 Should',pillClass:'p-should',items:[{id:'p1',label:'App cold-start time on a mid-range Android is under 3 seconds',p:'should'},{id:'p2',label:'Scrolling the home feed with 20+ quizzes is smooth (no jank)',p:'should'},{id:'p3',label:'AI generation completes within 60 s on a normal connection for a 5-page PDF',p:'should'},{id:'p4',label:'Tab transitions feel smooth — no stutter when switching between Home / Library / Profile',p:'should'},{id:'p5',label:'No memory leak after navigating between all tabs 10+ times',p:'nice'},{id:'p6',label:'Battery usage is normal — no background loops when idle',p:'nice'},{id:'p7',label:'App bundle size is acceptable — check expo export output before submitting',p:'should'}]},{id:'analytics',icon:'📊',iconBg:'rgba(52,211,153,0.12)',title:'Analytics & Crash Reporting',subtitle:'You need to know when users hit bugs after launch',pill:'🟠 Should',pillClass:'p-should',items:[{id:'an1',label:'Crash reporting (Sentry or Firebase Crashlytics) is integrated',p:'should'},{id:'an2',label:'Send a test crash — confirm it appears in the dashboard within 60 s',p:'should'},{id:'an3',label:'Key events tracked: quiz created, quiz completed, AI generation started / succeeded / failed',p:'should'},{id:'an4',label:'Key events tracked: battle started, battle completed, share link tapped',p:'should'},{id:'an5',label:'Analytics are NOT logging PII (no emails, no raw quiz content)',p:'must'}]},{id:'store',icon:'🏪',iconBg:'rgba(251,146,60,0.12)',title:'Play Store / App Store Readiness',subtitle:'Missing any of these will cause a rejection',pill:'🔴 Must',pillClass:'p-must',items:[{id:'s1',label:'App icon is set at all required sizes (512×512 Play Store, 1024×1024 App Store)',p:'must'},{id:'s2',label:'Splash screen is correct — not showing the Expo logo',p:'must'},{id:'s3',label:'App name and bundle ID are final in app.json',p:'must'},{id:'s4',label:'Screenshots prepared — minimum 3 for each required device type',p:'must'},{id:'s5',label:'Short description (80 chars) and long description are written and reviewed',p:'must'},{id:'s6',label:'Content rating questionnaire filled out in Play Console / App Store Connect',p:'must'},{id:'s7',label:'Feature graphic (1024×500 px) uploaded to Play Store',p:'should'},{id:'s8',label:'Deep link (scorrapp.com) is verified in Play Console (Digital Asset Links)',p:'should'},{id:'s9',label:'No restricted permissions without justification',p:'must'},{id:'s10',label:'Production build tested via Internal Testing track (not Expo Go)',p:'must'}]},{id:'legal',icon:'📄',iconBg:'rgba(248,113,113,0.12)',title:'Legal & Support',subtitle:'Play Store will reject without a privacy policy URL',pill:'🔴 Must',pillClass:'p-must',items:[{id:'l1',label:'Privacy policy is written and hosted at a public URL',p:'must'},{id:'l2',label:'Privacy policy URL is added to the Play Store / App Store listing',p:'must'},{id:'l3',label:'Support email is set up, monitored, and visible in the app (Settings screen)',p:'must'},{id:'l4',label:'Terms of service exist at a public URL',p:'should'},{id:'l5',label:'AI-generated content disclaimer is present (quizzes may contain errors)',p:'should'}]},{id:'security',icon:'🔒',iconBg:'rgba(129,140,248,0.12)',title:'Security',subtitle:'Painful to fix after launch',pill:'🟠 Should',pillClass:'p-should',items:[{id:'sec1',label:'API keys are NOT committed to Git — run: git log -p | grep -i "AIzaSy"',p:'must',note:'Should return zero results'},{id:'sec2',label:'All backend routes that mutate data require a valid Firebase auth token',p:'must'},{id:'sec3',label:'One user cannot spam the AI endpoint (rate limit or auth check in place)',p:'must'},{id:'sec4',label:'No sensitive data (tokens, keys, PII) is logged to console in production builds',p:'should'},{id:'sec5',label:'CORS is configured on the backend — only your domains are allowed',p:'should'}]},{id:'final',icon:'✅',iconBg:'rgba(52,211,153,0.15)',title:'Final Smoke Test (Day of Launch)',subtitle:'Run this the morning you submit to the store',pill:'🔴 Must',pillClass:'p-must',items:[{id:'fin1',label:'Build and submit the production binary (not Expo Go)',p:'must'},{id:'fin2',label:'Install the production build from Internal Testing / TestFlight',p:'must'},{id:'fin3',label:'Sign up → generate quiz with AI → solve it → view history — all works on production build',p:'must'},{id:'fin4',label:'/api/app-config returns correct data in production environment',p:'must'},{id:'fin5',label:'/api/version-config returns correct versions in production',p:'must'},{id:'fin6',label:'Keep Vercel logs open for the first hour after launch',p:'must'},{id:'fin7',label:'Emergency switches are ready: MAINTENANCE_MODE, DISABLE_AI, DISABLE_BATTLES',p:'must'}]}];

let filter='all';
const KEY='scorr_checklist_v1';
function getState(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}}
function saveState(s){localStorage.setItem(KEY,JSON.stringify(s))}
function toggle(id){const s=getState();s[id]=!s[id];saveState(s);render()}
function setFilter(f,btn){filter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render()}
function resetAll(){if(!confirm('Reset all checkboxes?'))return;saveState({});render()}
function updateProgress(){const state=getState();const all=DATA.flatMap(s=>s.items);const total=all.length;const done=all.filter(i=>state[i.id]).length;const pct=total?Math.round(done/total*100):0;document.getElementById('count').textContent=done+' / '+total;document.getElementById('pct').textContent=pct+'% complete';document.getElementById('bar').style.width=pct+'%';const banner=document.getElementById('done-banner');if(pct===100){banner.classList.add('show');setTimeout(()=>banner.classList.remove('show'),5000)}}
function toggleSection(id){document.getElementById('sec-'+id).classList.toggle('collapsed')}
function render(){const state=getState();const main=document.getElementById('main');main.innerHTML=DATA.map(section=>{const done=section.items.every(i=>state[i.id]);const prog=section.items.filter(i=>state[i.id]).length+'/'+section.items.length;const vis=section.items.filter(item=>filter==='todo'?!state[item.id]:filter==='done'?!!state[item.id]:true);if(filter!=='all'&&vis.length===0)return'';const pLabel=p=>p==='must'?'🔴 Must':p==='should'?'🟠 Should':'🟡 Nice';return`<div class="section ${done?'complete':''}" id="sec-${section.id}"><div class="section-header" onclick="toggleSection('${section.id}')"><div class="section-icon" style="background:${section.iconBg}">${section.icon}</div><div class="section-title"><h2>${section.title}</h2><p>${section.subtitle}</p></div><div class="section-meta"><span class="section-pill ${section.pillClass}">${done?'✓ Done':prog}</span><span class="section-chevron">▾</span></div></div><div class="section-body">${section.id==='final'?`<div class="emergency-box"><h3>⚡ Emergency switches — know these before you press publish</h3><table class="emergency-table"><tr><td>Backend goes down</td><td>MAINTENANCE_MODE=true → redeploy</td></tr><tr><td>AI returns garbage</td><td>DISABLE_AI=true → redeploy</td></tr><tr><td>Battles are broken</td><td>DISABLE_BATTLES=true → redeploy</td></tr><tr><td>Block an old buggy version</td><td>Raise APP_MINIMUM_VERSION → redeploy</td></tr><tr><td>Roll back backend</td><td>Revert commit → push → Vercel auto-deploys</td></tr></table></div>`:''} ${vis.map(item=>`<div class="item ${state[item.id]?'done':''}" onclick="toggle('${item.id}')"><div class="checkbox"><span class="checkbox-tick">✓</span></div><div class="item-content"><div class="item-label">${item.label}</div>${item.note?`<div class="item-note">${item.note}</div>`:''}</div><span class="priority p-${item.p}">${pLabel(item.p)}</span></div>`).join('')}</div></div>`}).join('');updateProgress()}
render();
</script>
</body>
</html>
