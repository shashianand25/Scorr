<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Scorr Pre-Launch Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08090f;--s1:#10131f;--card:#141826;--bdr:rgba(255,255,255,0.07);--acc:#6366f1;--acc2:#818cf8;--grn:#34d399;--red:#f87171;--ora:#fb923c;--yel:#fbbf24;--mut:#5a6080;--txt:#e2e8f0;--txt2:#94a3b8}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;min-height:100vh}
/* TOP BAR */
.topbar{background:#0d1020;border-bottom:1px solid var(--bdr);padding:0 28px;height:60px;display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:100}
.topbar-logo{font-size:17px;font-weight:800;background:linear-gradient(135deg,#818cf8,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.topbar-progress{flex:1;max-width:320px}
.tp-row{display:flex;justify-content:space-between;font-size:11px;color:var(--txt2);margin-bottom:5px}
.tp-count{font-weight:700;color:var(--acc2)}
.tp-bar{height:5px;background:rgba(255,255,255,0.07);border-radius:10px;overflow:hidden}
.tp-fill{height:100%;background:linear-gradient(90deg,#6366f1,#818cf8);border-radius:10px;transition:width .4s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px rgba(99,102,241,0.4)}
.topbar-filters{display:flex;gap:6px;margin-left:auto}
.fb{padding:5px 14px;border-radius:100px;border:1px solid var(--bdr);background:transparent;color:var(--txt2);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.fb:hover{border-color:var(--acc);color:var(--txt)}
.fb.on{background:var(--acc);border-color:var(--acc);color:#fff}
.rst{padding:5px 14px;border-radius:100px;border:1px solid rgba(248,113,113,0.25);background:rgba(248,113,113,0.07);color:var(--red);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.rst:hover{background:rgba(248,113,113,0.15)}
/* LAYOUT */
.layout{display:flex;flex:1}
/* SIDEBAR */
.sidebar{width:240px;min-width:240px;background:#0d1020;border-right:1px solid var(--bdr);padding:20px 0;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.phase-label{font-size:10px;font-weight:700;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;padding:14px 20px 6px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;transition:background .15s;border-left:3px solid transparent;text-decoration:none}
.sb-item:hover{background:rgba(255,255,255,0.03)}
.sb-item.active{background:rgba(99,102,241,0.08);border-left-color:var(--acc)}
.sb-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.sb-name{font-size:13px;font-weight:500;color:var(--txt2);flex:1;transition:color .15s}
.sb-item.active .sb-name{color:var(--txt)}
.sb-dot{width:6px;height:6px;border-radius:50%;background:var(--bdr);flex-shrink:0;transition:background .3s}
.sb-dot.done{background:var(--grn)}
.sb-dot.partial{background:var(--acc)}
/* CONTENT */
.content{flex:1;padding:28px 32px;max-width:820px}
/* PHASE HEADER */
.phase-hdr{display:flex;align-items:center;gap:10px;margin-bottom:20px;margin-top:36px}
.phase-hdr:first-child{margin-top:0}
.phase-hdr-emoji{font-size:18px}
.phase-hdr-text{font-size:13px;font-weight:700;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.phase-hdr-line{flex:1;height:1px;background:var(--bdr)}
/* SECTION CARD */
.sec-card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;margin-bottom:16px;overflow:hidden;transition:border-color .3s}
.sec-card.all-done{border-color:rgba(52,211,153,0.2)}
.sec-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--bdr)}
.sec-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sec-info{flex:1}
.sec-title{font-size:15px;font-weight:700;margin-bottom:1px}
.sec-sub{font-size:12px;color:var(--txt2)}
.sec-prog{font-size:12px;font-weight:600;color:var(--acc2);background:rgba(99,102,241,0.1);padding:3px 10px;border-radius:100px;border:1px solid rgba(99,102,241,0.2)}
.sec-prog.done{color:var(--grn);background:rgba(52,211,153,0.08);border-color:rgba(52,211,153,0.2)}
/* ITEM */
.item{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;cursor:pointer;transition:background .12s;border-top:1px solid var(--bdr)}
.item:first-of-type{border-top:none}
.item:hover{background:rgba(255,255,255,0.025)}
.item.hidden{display:none}
.cb{width:20px;height:20px;border-radius:6px;flex-shrink:0;border:1.5px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all .2s cubic-bezier(.4,0,.2,1)}
.item.done .cb{background:var(--grn);border-color:var(--grn);box-shadow:0 0 8px rgba(52,211,153,0.3)}
.cb-tick{opacity:0;transform:scale(0.4);transition:all .18s cubic-bezier(.4,0,.2,1);font-size:11px;font-weight:800;color:#08090f;line-height:1}
.item.done .cb-tick{opacity:1;transform:scale(1)}
.item-body{flex:1;min-width:0}
.item-label{font-size:13.5px;line-height:1.55;color:var(--txt);transition:color .2s}
.item.done .item-label{color:var(--mut);text-decoration:line-through;text-decoration-color:rgba(255,255,255,0.15)}
.item-note{font-size:11.5px;color:var(--mut);margin-top:3px;font-style:italic}
.item-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-top:2px}
.act-btn{padding:3px 10px;border-radius:100px;border:1px solid rgba(99,102,241,0.3);background:rgba(99,102,241,0.1);color:var(--acc2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.act-btn:hover{background:rgba(99,102,241,0.2);border-color:var(--acc)}
.act-btn.copied{background:rgba(52,211,153,0.12);border-color:rgba(52,211,153,0.3);color:var(--grn)}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.b-must{background:rgba(248,113,113,0.1);color:var(--red);border:1px solid rgba(248,113,113,0.2)}
.b-should{background:rgba(251,146,60,0.1);color:var(--ora);border:1px solid rgba(251,146,60,0.2)}
.b-nice{background:rgba(251,191,36,0.08);color:var(--yel);border:1px solid rgba(251,191,36,0.18)}
/* EMERGENCY */
.emrg{background:linear-gradient(135deg,rgba(99,102,241,0.07),rgba(129,140,248,0.04));border:1px solid rgba(99,102,241,0.18);border-radius:12px;padding:18px 20px;margin:16px 20px 4px}
.emrg h3{font-size:13px;font-weight:700;color:var(--acc2);margin-bottom:12px}
.emrg-row{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--bdr);font-size:12.5px}
.emrg-row:last-child{border-bottom:none}
.emrg-row span:first-child{color:var(--txt2);width:180px;flex-shrink:0}
.emrg-row span:last-child{font-family:'SF Mono','Fira Code',monospace;font-size:11.5px;color:var(--txt)}
/* CELEBRATION */
.celebrate{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;font-size:14px;font-weight:700;padding:13px 28px;border-radius:100px;box-shadow:0 8px 28px rgba(99,102,241,0.5);opacity:0;pointer-events:none;transition:all .4s;z-index:999;white-space:nowrap}
.celebrate.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:700px){.sidebar{display:none}.content{padding:20px 16px}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">🎯 Scorr Launch</div>
  <div class="topbar-progress">
    <div class="tp-row"><span class="tp-count" id="hcount">0 / 0</span><span id="hpct">0%</span></div>
    <div class="tp-bar"><div class="tp-fill" id="hbar" style="width:0%"></div></div>
  </div>
  <div class="topbar-filters">
    <button class="fb on" onclick="setFilter('all',this)">All</button>
    <button class="fb" onclick="setFilter('todo',this)">Remaining</button>
    <button class="fb" onclick="setFilter('done',this)">Done</button>
    <button class="rst" onclick="resetAll()">Reset</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content"></div>
</div>

<div class="celebrate" id="cel">🎉 All checks passed — you're ready to launch!</div>

<script>
const PHASES=[{label:"Phase 1 — Server",emoji:"🖥️",sections:[{id:"backend",icon:"🖥️",bg:"rgba(99,102,241,0.15)",title:"Backend & Config",sub:"Verify server is healthy before anything else",items:[{id:"b1",label:"Hit /api/app-config — verify it returns featureFlags, aiConfig, fileLimits, appLinks",p:"must",action:{type:"link",url:"https://api.scorrapp.com/api/app-config"}},{id:"b2",label:"Hit /api/version-config — verify it returns minimumVersion, latestVersion, updatePromptScheduleDays",p:"must",action:{type:"link",url:"https://api.scorrapp.com/api/version-config"}},{id:"b3",label:"No console.error in Vercel → Functions → Logs on a clean app boot",p:"must",action:{type:"link",url:"https://vercel.com"}},{id:"b4",label:"MAINTENANCE_MODE, DISABLE_AI, DISABLE_BATTLES are all false in Vercel",p:"must",action:{type:"link",url:"https://vercel.com"}},{id:"b5",label:"Test maintenance flag: set MAINTENANCE_MODE=true, open app, confirm gate screen, set it back",p:"must"},{id:"b6",label:"Test AI kill-switch: set DISABLE_AI=true, try generating a quiz, confirm alert, set it back",p:"must"},{id:"b7",label:"Backend enforces request size — send a 12 MB body, expect a 413 response",p:"must"},{id:"b8",label:"APP_MINIMUM_VERSION and APP_LATEST_VERSION match the version in app.json",p:"must"},{id:"b9",label:"GEMINI_API_KEY is valid — make a real AI generation call and confirm it succeeds",p:"must"},{id:"b10",label:"DB connection does not time out after 5+ minutes of idle",p:"should"}]}]},{label:"Phase 2 — App Testing",emoji:"🔄",sections:[{id:"flow",icon:"🔄",bg:"rgba(52,211,153,0.12)",title:"Full User Flow",sub:"Test on a real device — not a simulator",items:[{id:"f1",label:"Sign up with a brand-new email — no errors, reaches home screen",p:"must"},{id:"f2",label:"Create a quiz manually (type questions and answers)",p:"must"},{id:"f3",label:"Import a quiz from a PDF file",p:"must"},{id:"f4",label:"Import a quiz from a PPT file",p:"must"},{id:"f5",label:"Generate a quiz using AI from a PDF — questions look correct",p:"must"},{id:"f6",label:"Solve the quiz — answers register correctly, score is right",p:"must"},{id:"f7",label:"View results / report card — all answers shown correctly",p:"must"},{id:"f8",label:"Check quiz history — attempt appears with correct score and date",p:"must"},{id:"f9",label:"Open Insights — stats and graphs are correct",p:"must"},{id:"f10",label:"Create a flashcard deck and study it (flip, mark known/unknown)",p:"must"},{id:"f11",label:"Share a quiz — link looks correct, opens app on another device",p:"must"},{id:"f12",label:"Import a shared quiz from a deep link (scorrapp.com/share/quiz/...)",p:"must"},{id:"f13",label:"Create a Battle room, join from a second device, complete a match",p:"must"},{id:"f14",label:"Log out — session is cleared",p:"must"},{id:"f15",label:"Log back in — all data is still there",p:"must"},{id:"f16",label:"Uninstall the app, reinstall, log in — data is still there",p:"must"},{id:"f17",label:"Delete a quiz — it disappears and does not reappear on refresh",p:"must"},{id:"f18",label:"Edit a quiz title — change persists after force-closing and reopening",p:"should"}]},{id:"errors",icon:"⚠️",bg:"rgba(251,191,36,0.12)",title:"Error & Edge Cases",sub:"Every error path must show a human-readable message",items:[{id:"e1",label:"Airplane mode mid-quiz — app does not crash, data is not lost",p:"must"},{id:"e2",label:"Airplane mode before opening — cached data shows, no white screen or crash",p:"must"},{id:"e3",label:"Upload a file that exceeds the size limit — clear error, not a raw JSON dump",p:"must"},{id:"e4",label:"Upload a corrupt or empty PDF — error message is clear",p:"must"},{id:"e5",label:"Upload an unsupported file type — clear rejection, app does not hang",p:"must"},{id:"e6",label:"AI generation times out (60 s) — user sees useful message, not a frozen spinner",p:"must"},{id:"e7",label:"Kill the backend mid-generation — app shows error and lets the user try again",p:"must"},{id:"e8",label:"Join a Battle with an invalid room code — error message is clear",p:"must"},{id:"e9",label:"Create a Battle, second player never joins — host can exit cleanly",p:"must"},{id:"e10",label:"Sign up with an already-used email — error is specific",p:"must"},{id:"e11",label:"Sign in with wrong password — error is specific (not 'something went wrong')",p:"must"},{id:"e12",label:"AI returns empty or garbled text — app shows error, does not save empty quiz",p:"must"},{id:"e13",label:"Submit a quiz with zero questions — blocked with clear validation message",p:"should"},{id:"e14",label:"Open a share link for a quiz that no longer exists — graceful error, not a crash",p:"should"}]},{id:"network",icon:"📡",bg:"rgba(129,140,248,0.12)",title:"Network Conditions",sub:"Use Network Link Conditioner (iOS) or Developer Options (Android)",items:[{id:"n1",label:"Slow 3G — loading states appear, not blank screens",p:"should",note:"iOS: Network Link Conditioner · Android: Developer Options → Simulate network"},{id:"n2",label:"Slow 3G — errors shown if requests fail, not infinite spinners",p:"should"},{id:"n3",label:"Intermittent network (toggle airplane mode every few seconds) — no crashes",p:"should"},{id:"n4",label:"Retry is possible without restarting the app after a network failure",p:"should"},{id:"n5",label:"AI generation shows progress bar on slow network, not just a blank screen",p:"should"}]}]},{label:"Phase 3 — Security",emoji:"🔐",sections:[{id:"auth",icon:"🔐",bg:"rgba(248,113,113,0.12)",title:"Auth & Data Safety",sub:"Session security and per-user data isolation",items:[{id:"a1",label:"Password reset flow works end to end (email arrives, link works, new password set)",p:"must"},{id:"a2",label:"Session persists after force-closing and reopening the app",p:"must"},{id:"a3",label:"A logged-out user cannot access authenticated API routes (returns 401)",p:"must"},{id:"a4",label:"User A cannot see or access User B's quizzes",p:"must"},{id:"a5",label:"Firebase security rules prevent direct DB reads/writes without auth",p:"must"},{id:"a6",label:"Neon/Postgres is not publicly accessible without credentials",p:"must"}]},{id:"security",icon:"🔒",bg:"rgba(99,102,241,0.12)",title:"Security",sub:"Painful to fix after launch",items:[{id:"sec1",label:"API keys are NOT committed to Git — should return zero results",p:"must",note:'Run: git log -p | grep -i "AIzaSy"',action:{type:"copy",text:'git log -p | grep -i "AIzaSy"'}},{id:"sec2",label:"All backend routes that mutate data require a valid Firebase auth token",p:"must"},{id:"sec3",label:"One user cannot spam the AI endpoint (rate limit or auth check in place)",p:"must"},{id:"sec4",label:"No sensitive data (tokens, keys, PII) logged to console in production builds",p:"should"},{id:"sec5",label:"CORS is configured — only your domains are allowed",p:"should",action:{type:"link",url:"https://api.scorrapp.com/api/app-config"}}]}]},{label:"Phase 4 — Quality",emoji:"⚡",sections:[{id:"perf",icon:"⚡",bg:"rgba(251,191,36,0.12)",title:"Performance",sub:"Test on a mid-range Android device, not a flagship",items:[{id:"p1",label:"App cold-start time on a mid-range Android is under 3 seconds",p:"should"},{id:"p2",label:"Scrolling the home feed with 20+ quizzes is smooth (no jank)",p:"should"},{id:"p3",label:"AI generation completes within 60 s on a normal connection for a 5-page PDF",p:"should"},{id:"p4",label:"Tab transitions feel smooth — no stutter between Home / Library / Profile",p:"should"},{id:"p5",label:"No memory leak after navigating between all tabs 10+ times",p:"nice"},{id:"p6",label:"Battery usage is normal — no background loops when idle",p:"nice"},{id:"p7",label:"App bundle size is acceptable — check expo export output",p:"should"}]},{id:"analytics",icon:"📊",bg:"rgba(52,211,153,0.12)",title:"Analytics & Crash Reporting",sub:"You need visibility when users hit bugs after launch",items:[{id:"an1",label:"Crash reporting (Sentry or Firebase Crashlytics) is integrated",p:"should"},{id:"an2",label:"Send a test crash — confirm it appears in the dashboard within 60 s",p:"should"},{id:"an3",label:"Key events tracked: quiz created, completed, AI generation started/succeeded/failed",p:"should"},{id:"an4",label:"Key events tracked: battle started, completed, share link tapped",p:"should"},{id:"an5",label:"Analytics are NOT logging PII (no emails, no raw quiz content)",p:"must"}]}]},{label:"Phase 5 — Store & Legal",emoji:"🏪",sections:[{id:"store",icon:"🏪",bg:"rgba(251,146,60,0.12)",title:"Play Store Readiness",sub:"Missing any of these will cause a rejection",items:[{id:"s1",label:"App icon is set at all required sizes (512×512 Play Store, 1024×1024 App Store)",p:"must"},{id:"s2",label:"Splash screen is correct — not showing the Expo logo",p:"must"},{id:"s3",label:"App name and bundle ID are final in app.json",p:"must"},{id:"s4",label:"Screenshots prepared — minimum 3 for each required device type",p:"must"},{id:"s5",label:"Short description (80 chars) and long description are written and reviewed",p:"must"},{id:"s6",label:"Content rating questionnaire filled out in Play Console",p:"must",action:{type:"link",url:"https://play.google.com/console"}},{id:"s7",label:"Feature graphic (1024×500 px) uploaded to Play Store",p:"should",action:{type:"link",url:"https://play.google.com/console"}},{id:"s8",label:"Deep link (scorrapp.com) verified in Play Console",p:"should",action:{type:"link",url:"https://play.google.com/console"}},{id:"s9",label:"No restricted permissions without justification",p:"must"},{id:"s10",label:"Production build tested via Internal Testing track (not Expo Go)",p:"must",action:{type:"link",url:"https://play.google.com/console"}}]},{id:"legal",icon:"📄",bg:"rgba(248,113,113,0.1)",title:"Legal & Support",sub:"Play Store will reject without a privacy policy URL",items:[{id:"l1",label:"Privacy policy is written and hosted at a public URL",p:"must"},{id:"l2",label:"Privacy policy URL is added to the Play Store / App Store listing",p:"must"},{id:"l3",label:"Support email is set up, monitored, and visible in the app (Settings screen)",p:"must"},{id:"l4",label:"Terms of service exist at a public URL",p:"should"},{id:"l5",label:"AI-generated content disclaimer is present (quizzes may contain errors)",p:"should"}]}]},{label:"Phase 6 — Launch Day",emoji:"🚀",sections:[{id:"final",icon:"🚀",bg:"rgba(52,211,153,0.15)",title:"Final Smoke Test",sub:"Run this the morning you submit to the store",isLast:true,items:[{id:"fin1",label:"Build and submit the production binary (not Expo Go)",p:"must"},{id:"fin2",label:"Install the production build from Internal Testing / TestFlight",p:"must"},{id:"fin3",label:"Sign up → AI quiz → solve it → view history — all works on production build",p:"must"},{id:"fin4",label:"/api/app-config returns correct data in production",p:"must",action:{type:"link",url:"https://api.scorrapp.com/api/app-config"}},{id:"fin5",label:"/api/version-config returns correct versions",p:"must",action:{type:"link",url:"https://api.scorrapp.com/api/version-config"}},{id:"fin6",label:"Keep Vercel logs open for the first hour after launch",p:"must",action:{type:"link",url:"https://vercel.com"}},{id:"fin7",label:"Emergency switches ready: MAINTENANCE_MODE, DISABLE_AI, DISABLE_BATTLES",p:"must",action:{type:"link",url:"https://vercel.com"}}]}]}];

const KEY="scorr_v3";
let filter="all";
function gs(){try{const s=JSON.parse(localStorage.getItem(KEY)||"{}");if(s.f8===undefined)s.f8=true;return s;}catch{return{f8:true}}}
function ss(s){localStorage.setItem(KEY,JSON.stringify(s))}
function allItems(){return PHASES.flatMap(p=>p.sections.flatMap(s=>s.items))}
function toggle(id,e){e.stopPropagation();const s=gs();s[id]=!s[id];ss(s);render()}
function setFilter(f,btn){filter=f;document.querySelectorAll(".fb").forEach(b=>b.classList.remove("on"));btn.classList.add("on");render()}
function resetAll(){if(!confirm("Reset all checkboxes?"))return;ss({});render()}
function copyText(txt,btn,e){e.stopPropagation();navigator.clipboard.writeText(txt).then(()=>{btn.textContent="Copied!";btn.classList.add("copied");setTimeout(()=>{btn.textContent="Copy";btn.classList.remove("copied")},2000)})}

function updateProgress(){
  const s=gs();const all=allItems();const total=all.length;const done=all.filter(i=>s[i.id]).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById("hcount").textContent=done+" / "+total;
  document.getElementById("hpct").textContent=pct+"%";
  document.getElementById("hbar").style.width=pct+"%";
  const cel=document.getElementById("cel");
  if(pct===100){cel.classList.add("show");setTimeout(()=>cel.classList.remove("show"),5000)}
}

function sectionDone(sec,s){return sec.items.every(i=>s[i.id])}
function sectionProg(sec,s){return sec.items.filter(i=>s[i.id]).length+"/"+sec.items.length}
function badgeClass(p){return p==="must"?"b-must":p==="should"?"b-should":"b-nice"}
function badgeTxt(p){return p==="must"?"Must":p==="should"?"Should":"Nice"}

function actionBtn(action){
  if(!action)return"";
  if(action.type==="link")return`<a class="act-btn" href="${action.url}" target="_blank" onclick="event.stopPropagation()">Test →</a>`;
  if(action.type==="copy")return`<button class="act-btn" onclick="copyText(${JSON.stringify(action.text)},this,event)">Copy</button>`;
  return"";
}

function render(){
  const s=gs();
  // sidebar
  const sb=document.getElementById("sidebar");
  sb.innerHTML=PHASES.map(ph=>`
    <div class="phase-label">${ph.emoji} ${ph.label}</div>
    ${ph.sections.map(sec=>{
      const done=sectionDone(sec,s);
      const partial=sec.items.some(i=>s[i.id]);
      return`<a class="sb-item" href="#${sec.id}" onclick="setActive('${sec.id}')">
        <span class="sb-icon">${sec.icon}</span>
        <span class="sb-name">${sec.title}</span>
        <span class="sb-dot ${done?"done":partial?"partial":""}"></span>
      </a>`;
    }).join("")}
  `).join("");

  // content
  const ct=document.getElementById("content");
  ct.innerHTML=PHASES.map(ph=>`
    <div class="phase-hdr">
      <span class="phase-hdr-emoji">${ph.emoji}</span>
      <span class="phase-hdr-text">${ph.label}</span>
      <div class="phase-hdr-line"></div>
    </div>
    ${ph.sections.map(sec=>{
      const done=sectionDone(sec,s);
      const prog=sectionProg(sec,s);
      const vis=sec.items.filter(it=>filter==="todo"?!s[it.id]:filter==="done"?!!s[it.id]:true);
      if(filter!=="all"&&vis.length===0)return"";
      return`<div class="sec-card ${done?"all-done":""}" id="${sec.id}">
        <div class="sec-head">
          <div class="sec-ico" style="background:${sec.bg}">${sec.icon}</div>
          <div class="sec-info">
            <div class="sec-title">${sec.title}</div>
            <div class="sec-sub">${sec.sub}</div>
          </div>
          <span class="sec-prog ${done?"done":""}">${done?"✓ Done":prog}</span>
        </div>
        ${sec.isLast?`<div class="emrg"><h3>⚡ If something breaks after launch</h3>
          <div class="emrg-row"><span>Backend goes down</span><span>MAINTENANCE_MODE=true → redeploy</span></div>
          <div class="emrg-row"><span>AI is broken</span><span>DISABLE_AI=true → redeploy</span></div>
          <div class="emrg-row"><span>Battles are broken</span><span>DISABLE_BATTLES=true → redeploy</span></div>
          <div class="emrg-row"><span>Block old buggy version</span><span>Raise APP_MINIMUM_VERSION → redeploy</span></div>
          <div class="emrg-row"><span>Roll back backend</span><span>revert commit → push → auto-deploys</span></div>
        </div>`:""}
        ${vis.map(it=>`
          <div class="item ${s[it.id]?"done":""}" onclick="toggle('${it.id}',event)">
            <div class="cb"><span class="cb-tick">✓</span></div>
            <div class="item-body">
              <div class="item-label">${it.label}</div>
              ${it.note?`<div class="item-note">${it.note}</div>`:""}
            </div>
            <div class="item-right">
              ${actionBtn(it.action)}
              <span class="badge ${badgeClass(it.p)}">${badgeTxt(it.p)}</span>
            </div>
          </div>
        `).join("")}
      </div>`;
    }).join("")}
  `).join("");

  updateProgress();
}

function setActive(id){
  document.querySelectorAll(".sb-item").forEach(el=>el.classList.remove("active"));
  const link=document.querySelector(`.sb-item[href="#${id}"]`);
  if(link)link.classList.add("active");
}

// Intersection observer to highlight sidebar on scroll
window.addEventListener("DOMContentLoaded",()=>{
  render();
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting)setActive(e.target.id)});
  },{threshold:0.3,rootMargin:"-60px 0px -60% 0px"});
  document.querySelectorAll(".sec-card[id]").forEach(el=>obs.observe(el));
});
</script>
</body>
</html>
